<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ACE-Step Music - Local AI music generation web UI" />
    <meta name="theme-color" content="#ec4899" />
    <title>ACE-Step Music</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2L2 7L12 12L22 7L12 2Z' fill='%23ec4899'/%3E%3Cpath d='M2 17L12 22L22 17' stroke='%23a855f7' stroke-width='2' fill='none'/%3E%3C/svg%3E" />

    <!-- Tailwind CSS via CDN (dev convenience) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              suno: {
                DEFAULT: '#09090b',
                sidebar: '#000000',
                panel: '#121214',
                card: '#18181b',
                hover: '#27272a',
                border: '#27272a',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
          }
        }
      }
    </script>

    <link rel="stylesheet" href="/index.css" />

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

      html, body, #root { height: 100%; margin: 0; }
      body { font-family: 'Inter', sans-serif; }

      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #a1a1aa; }
      .dark ::-webkit-scrollbar-thumb { background: #3f3f46; }
      .dark ::-webkit-scrollbar-thumb:hover { background: #52525b; }

      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .scrollbar-hide::-webkit-scrollbar { display: none; }

      .gradient-text {
        background: linear-gradient(to right, #f472b6, #a78bfa, #60a5fa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      @keyframes slide-in-right {
        from { transform: translateX(100%); }
        to { transform: translateX(0); }
      }
      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .drawer-slide-in-right { animation: slide-in-right 0.3s ease-out forwards; }
      .drawer-backdrop-in { animation: fade-in 0.3s ease-out forwards; }

      .animate-in { animation: fade-in 0.25s ease-out; }
      .fade-in { animation: fade-in 0.25s ease-out; }
      .slide-in-from-bottom-2 { animation: fade-in 0.25s ease-out; }

      .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #52525b; }
    </style>
  </head>
  <body class="bg-suno text-zinc-900 dark:text-white overflow-hidden transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
